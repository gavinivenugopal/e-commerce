<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>My E-Commerce Store</h1>
        <div class="cart">
            <button id="cart-button" onclick="toggleCart()">Cart (0)</button>
        </div>
    </header>

    <section class="products">
        <div class="product">
            <img src="headphones.png" alt="Product 1" width="32%">
            <h3>Product 1</h3>
            <p>$20.00</p>
            <button onclick="addToCart('Product 1', 20)">Add to Cart</button>
        </div>
        <div class="product">
            <img src="sneakers.png" alt="Product 2" width="32%">
            <h3>Product 2</h3>
            <p>$35.00</p>
            <button onclick="addToCart('Product 2', 35)">Add to Cart</button>
        </div>
        <div class="product">
            <img src="smartwatch.png" alt="Product 3">
            <h3>Product 3</h3>
            <p>$50.00</p>
            <button onclick="addToCart('Product 3', 50)">Add to Cart</button>
        </div>
    </section>

    <div id="cart-popup" class="cart-popup">
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
        <p>Total: $<span id="cart-total">0</span></p>
        <button onclick="clearCart()">Clear Cart</button>
        <button onclick="toggleCart()">Close</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
